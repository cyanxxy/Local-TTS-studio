[package]
name = "qwen3-tts-rs"
version = "0.2.2"
edition = "2021"
authors = ["Michael Yuan <michael@secondstate.io>"]
description = "Rust port of Qwen3 TTS - Text-to-Speech model"
license = "Apache-2.0"
repository = "https://github.com/juntao/qwen3_tts_rs"
keywords = ["tts", "text-to-speech", "qwen", "ai", "machine-learning"]
categories = ["multimedia::audio", "science"]
exclude = ["models/", "*.wav", ".DS_Store"]

[dependencies]
# PyTorch bindings via libtorch (0.20 for PyTorch 2.7.1 compatibility)
# Only used with the tch-backend feature
tch = { version = "0.20", optional = true }

# Tokenization
# Open TTS: no `esaxx_fast`. Its C++ is built with the static MSVC runtime (/MT),
# which cannot link with LibTorch and llama.cpp (/MD) on Windows, and it only
# speeds up Unigram training, which inference never runs.
tokenizers = { version = "0.23", default-features = false, features = ["onig", "progressbar"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Audio processing
hound = "3.5"
rubato = "0.16"
# Open TTS: the encoders serve only the HTTP API (`api` feature).
mp3lame-encoder = { version = "0.2", optional = true }
flacenc = { version = "0.5", optional = true }
audiopus = { version = "0.2", optional = true }
audiopus_sys = { version = "0.1", features = ["static"], optional = true }
ogg = { version = "0.9", optional = true }

# HTTP and file handling
# Open TTS: 0.23 enables `simd-unsafe` by default; keep the safe scalar decoder.
base64 = { version = "0.23", default-features = false, features = ["std"] }
url = "2.5"

# Error handling
thiserror = "2.0"
anyhow = { version = "1.0", optional = true }

# Logging
tracing = "0.1"

# API server
# Open TTS: optional so library users can leave out the server stack; see the
# `api` and `cli` features.
axum = { version = "0.8", features = ["multipart"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tokio-stream = { version = "0.1", optional = true }
async-stream = { version = "0.3", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
tower-http = { version = "0.7", features = ["trace"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[features]
default = ["tch-backend", "cli"]
# Use libtorch/PyTorch as the computation backend (default)
tch-backend = ["dep:tch"]
# Use Apple MLX as the computation backend (macOS Apple Silicon only).
# Requires the bundled mlx-c source tree documented in OPEN_TTS_VENDOR.md.
mlx = []
# Open TTS: the HTTP API module (`qwen3_tts_rs::api`) and its audio encoders.
api = [
    "dep:async-stream",
    "dep:audiopus",
    "dep:audiopus_sys",
    "dep:axum",
    "dep:flacenc",
    "dep:mp3lame-encoder",
    "dep:ogg",
    "dep:tokio",
    "dep:tokio-stream",
]
# Open TTS: the command-line binaries, including the API server.
cli = ["api", "dep:anyhow", "dep:clap", "dep:tower-http", "dep:tracing-subscriber"]

[build-dependencies]
cmake = "0.1"

[[bin]]
name = "tts"
path = "src/bin/tts.rs"
required-features = ["cli"]

[[bin]]
name = "voice_clone"
path = "src/bin/voice_clone.rs"
required-features = ["cli"]

[[bin]]
name = "api_server"
path = "src/bin/api_server.rs"
required-features = ["cli"]

[[bin]]
name = "pibot-tts-worker"
path = "src/bin/worker.rs"
required-features = ["cli"]

[[bin]]
name = "qwen3-tts"
path = "src/bin/qwen3_tts_cli.rs"
required-features = ["cli"]

[[bin]]
name = "trace_vocoder"
path = "src/bin/trace_vocoder.rs"
required-features = ["cli"]

[[bin]]
name = "trace_rust"
path = "src/bin/trace_rust.rs"
required-features = ["cli"]

[dev-dependencies]
tempfile = "3.14"
