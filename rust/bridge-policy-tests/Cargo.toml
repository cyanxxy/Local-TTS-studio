[package]
name = "open-tts-bridge-policy-tests"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

# The pure-Rust subset of the bridge's own dependencies, at the same versions
# (see rust/local-tts-bridge/Cargo.lock). Nothing here builds native code.
[dev-dependencies]
anyhow = "1.0"
hound = "3.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
socket2 = "0.6"
tempfile = "3.27"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

# The bridge's build.rs declares `cfg(qwen3_native)`; the shared sources use it,
# and this crate never sets it, so declare the name here too.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(qwen3_native)"] }
