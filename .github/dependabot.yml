version: 2
updates:
  # Workflow actions are SHA-pinned; Dependabot bumps the SHA and the
  # trailing version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: cargo
    directory: /rust/local-tts-bridge
    schedule:
      interval: weekly
    # rust/vendor/qwen3-tts-rs is a digest-pinned path dependency maintained
    # by hand (see rust/vendor/qwen3-tts-rs/OPEN_TTS_VENDOR.md).
    ignore:
      - dependency-name: qwen3-tts-rs
