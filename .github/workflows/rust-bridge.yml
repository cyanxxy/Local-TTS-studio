name: Rust bridge

on:
  push:
    branches:
      - main
    paths:
      - "rust/**"
      - "rust-toolchain.toml"
      - "scripts/*rust*"
      - ".npmrc"
      - ".nvmrc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/rust-bridge.yml"
  pull_request:
    paths:
      - "rust/**"
      - "rust-toolchain.toml"
      - "scripts/*rust*"
      - ".npmrc"
      - ".nvmrc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/rust-bridge.yml"

permissions:
  contents: read

concurrency:
  group: rust-bridge-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  format:
    name: Check Rust formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      # No toolchain argument: rustup installs the active toolchain, so the
      # channel, profile, and components all come from rust-toolchain.toml
      # rather than being restated here. Needs rustup 1.28+, which the runner
      # images ship. Pre-installing keeps the download off the cargo critical path.
      - run: rustup toolchain install --no-self-update
      # The vendored qwen3-tts-rs tree is digest-pinned to its upstream
      # snapshot and is intentionally not held to local formatting.
      - run: cargo fmt --manifest-path rust/local-tts-bridge/Cargo.toml --check

  build-and-test:
    name: Build and test bridge (macOS arm64)
    runs-on: macos-26
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: "26.0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/rust/local-tts-bridge/target
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - name: Install native build tools
        # `rustup toolchain install` without a toolchain argument resolves the
        # channel, profile, and components from rust-toolchain.toml.
        run: |
          rustup toolchain install --no-self-update
          brew install cmake libomp openssl@3 pkg-config automake autoconf libtool
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/local-tts-bridge
          env-vars: CARGO_TARGET_DIR MACOSX_DEPLOYMENT_TARGET
          # llama-cpp-sys keeps shared CMake dylibs in a non-Cargo directory
          # inside target. rust-cache prunes non-dependency target entries before
          # saving, which can otherwise restore an rlib whose linked dylibs are
          # missing. Cache the CMake tree explicitly, but rebuild Cargo artifacts.
          cache-targets: false
          cache-directories: rust/local-tts-bridge/target/llama-cmake-cache
          key: llama-cmake-only-v2
      - run: npm ci
      - name: Build bridge and run Rust checks
        shell: bash
        run: |
          OPENSSL_DIR="$(brew --prefix openssl@3)"
          export OPENSSL_DIR
          export PKG_CONFIG_PATH="$OPENSSL_DIR/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          npm run build:rust
          npm run lint:rust
          npm run test:rust -- --release
      - name: Probe packaged bridge
        run: ./dist-rust/open-tts-local-bridge --action probe --model qwen3 --cache-dir "$RUNNER_TEMP/open-tts-probe"
