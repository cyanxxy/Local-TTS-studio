name: Rust bridge

on:
  push:
    branches:
      - main
    paths:
      - "rust/**"
      - "rust-toolchain.toml"
      # Controls how the vendored qwen3-tts-rs tree is checked out.
      - ".gitattributes"
      - "scripts/*rust*"
      - "scripts/verify-electron-package.mjs"
      - "scripts/install-windows.ps1"
      - ".npmrc"
      - ".nvmrc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/rust-bridge.yml"
  pull_request:
    paths:
      - "rust/**"
      - "rust-toolchain.toml"
      # Controls how the vendored qwen3-tts-rs tree is checked out.
      - ".gitattributes"
      - "scripts/*rust*"
      - "scripts/verify-electron-package.mjs"
      - "scripts/install-windows.ps1"
      - ".npmrc"
      - ".nvmrc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/rust-bridge.yml"
  # Lets a maintainer re-run the macOS gate on any ref without pushing a
  # change that matches the path filters.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-bridge-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  format:
    name: Check Rust formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # No toolchain argument: rustup installs the active toolchain, so the
      # channel, profile, and components all come from rust-toolchain.toml
      # rather than being restated here. Needs rustup 1.28+, which the runner
      # images ship. Pre-installing keeps the download off the cargo critical path.
      - run: rustup toolchain install --no-self-update
      # The vendored qwen3-tts-rs tree is digest-pinned to its upstream
      # snapshot and is intentionally not held to local formatting. Name the
      # members: on the virtual workspace root a bare `cargo fmt` fails with
      # "Failed to find targets", and `--all` would also format path
      # dependencies such as the vendored crate.
      - run: cargo fmt --manifest-path rust/Cargo.toml -p open-tts-bridge-core -p open-tts-local-bridge --check

  deny:
    name: Check Rust dependencies (cargo-deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # Advisories, licences, bans, and sources per rust/deny.toml. The
      # action's default `--all-features` is dropped so CI checks the same
      # graph as a local `cargo deny check`.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: rust/Cargo.toml
          arguments: ""

  build-and-test:
    name: Build and test bridge (macOS arm64)
    runs-on: macos-26
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: "26.0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/rust/local-tts-bridge/target
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - name: Install native build tools
        # `rustup toolchain install` without a toolchain argument resolves the
        # channel, profile, and components from rust-toolchain.toml.
        run: |
          rustup toolchain install --no-self-update
          brew install cmake libomp openssl@3 pkg-config
      - name: Point Cargo at Homebrew OpenSSL
        shell: bash
        run: |
          openssl_dir="$(brew --prefix openssl@3)"
          {
            echo "OPENSSL_DIR=$openssl_dir"
            echo "PKG_CONFIG_PATH=$openssl_dir/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> local-tts-bridge/target
          env-vars: CARGO_TARGET_DIR MACOSX_DEPLOYMENT_TARGET
          # llama-cpp-sys keeps shared CMake dylibs in a non-Cargo directory
          # inside target. rust-cache prunes non-dependency target entries before
          # saving, which can otherwise restore an rlib whose linked dylibs are
          # missing. Cache the CMake tree explicitly, but rebuild Cargo artifacts.
          cache-targets: false
          cache-directories: rust/local-tts-bridge/target/llama-cmake-cache
          key: llama-cmake-only-v2
      - run: npm ci
      # Three separate steps so a Clippy or test failure is attributable at a
      # glance and each phase gets its own timing in the job summary. All three
      # use --release, so Clippy and the tests reuse the build's artifacts.
      - name: Build bridge
        run: npm run build:rust
      - name: Clippy
        run: npm run lint:rust
      - name: Test bridge
        run: npm run test:rust -- --release
      - name: Probe packaged bridge
        run: ./dist-rust/open-tts-local-bridge --action probe --model qwen3 --cache-dir "$RUNNER_TEMP/open-tts-probe"

  check-windows:
    name: Check bridge (Windows x64)
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}\rust\target
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: rustup toolchain install --no-self-update
      # tch 0.20 needs LibTorch 2.7.0 (docs/local-runtimes.md). The CPU build is
      # enough to compile and lint the LibTorch code path.
      - name: Download LibTorch 2.7.0 (CPU)
        shell: pwsh
        run: |
          $ProgressPreference = "SilentlyContinue"
          $zip = Join-Path $env:RUNNER_TEMP "libtorch.zip"
          Invoke-WebRequest -Uri "https://download.pytorch.org/libtorch/cpu/libtorch-win-shared-with-deps-2.7.0%2Bcpu.zip" -OutFile $zip
          # PyTorch publishes no checksums; the digest is pinned here and in
          # scripts/install-windows.ps1, so a re-uploaded archive fails both.
          $digest = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          if ($digest -ne "2267cd447052bc839df147afc03865b5569336f9a45c43841142844e2011a561") { throw "The LibTorch archive changed: $digest" }
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP
          "LIBTORCH=$(Join-Path $env:RUNNER_TEMP 'libtorch')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
          env-vars: CARGO_TARGET_DIR LIBTORCH
          # Same reason as the macOS job: llama-cpp-sys keeps CMake output
          # outside Cargo's artifacts, so cache the registry only.
          cache-targets: false
          key: windows-v1
      # Compiles and lints everything the Windows build links, including the
      # cfg(qwen3_native) LibTorch backend that no other job builds. Tests are
      # not run: they would need the LibTorch DLLs on PATH and models.
      - name: Clippy
        run: cargo clippy --locked --release --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      # Build, package, install and start what a Windows user gets, through the
      # one-command installer under Windows PowerShell 5.1, the shell every
      # Windows 11 has: its private Node, the bridge with its LibTorch and
      # Visual C++ runtime DLLs (build-rust-bridge.mjs fails when the runtime
      # cannot be found), the NSIS installer, which the afterPack check
      # inspects (scripts/verify-electron-package.mjs), and a silent per-user
      # install. The runner image already has every prerequisite, so winget is
      # never needed here.
      - name: Check prerequisites with the Windows installer
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install-windows.ps1 -Check -Source .
      - name: Build and install with the Windows installer
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install-windows.ps1 -Source .
      - name: Probe installed bridge
        shell: pwsh
        run: '& "$env:LOCALAPPDATA\Programs\Open TTS\resources\dist-rust\open-tts-local-bridge.exe" --action probe --model qwen3 --cache-dir "$env:RUNNER_TEMP\open-tts-probe"'
