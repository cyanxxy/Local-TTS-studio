name: Publish source release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: source-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-24.04
    outputs:
      create_tag: ${{ steps.release.outputs.create_tag }}
      publish_release: ${{ steps.release.outputs.publish_release }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      should_verify: ${{ steps.release.outputs.should_verify }}
    # rustLocalBridge.test.ts cargo-builds the native bridge on this Ubuntu
    # runner; leave headroom for a cold compile.
    timeout-minutes: 45
    env:
      # rustLocalBridge.test.ts honours CARGO_TARGET_DIR; point it inside the
      # workspace so Swatinem/rust-cache can see and cache the build.
      CARGO_TARGET_DIR: ${{ github.workspace }}/rust/local-tts-bridge/target
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Resolve release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          package_version="$(node -p "require('./package.json').version")"
          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Package version must use MAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          release_tag="v$package_version"

          create_tag=false
          publish_release=false
          should_verify=false
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "$release_tag" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match package version $package_version." >&2
              exit 1
            fi
            publish_release=true
            should_verify=true
          elif git ls-remote --exit-code --tags origin "refs/tags/$release_tag" >/dev/null 2>&1; then
            if [[ "$(gh release view "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq '.isDraft' 2>/dev/null || true)" == "false" ]]; then
              echo "$release_tag and its published release already exist; this main push is not a new release."
            else
              publish_release=true
              should_verify=true
            fi
          else
            create_tag=true
            publish_release=true
            should_verify=true
          fi

          if [[ "$publish_release" == "true" ]]; then
            test -f "docs/releases/$release_tag.md"
          fi

          {
            echo "create_tag=$create_tag"
            echo "publish_release=$publish_release"
            echo "release_tag=$release_tag"
            echo "should_verify=$should_verify"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: steps.release.outputs.should_verify == 'true'
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - name: Install pinned Rust toolchain
        if: steps.release.outputs.should_verify == 'true'
        # No toolchain argument: rustup installs the active toolchain, so the
        # channel, profile, and components all come from rust-toolchain.toml.
        # Doing it here keeps the download off the critical path of the bridge test.
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.release.outputs.should_verify == 'true'
        with:
          workspaces: rust/local-tts-bridge
          env-vars: CARGO_TARGET_DIR
          # Mirrors rust-bridge.yml: llama-cpp-sys keeps shared CMake dylibs in a
          # non-Cargo directory inside target, and rust-cache prunes non-dependency
          # target entries before saving. Cache the CMake tree explicitly, but
          # rebuild Cargo artifacts.
          cache-targets: false
          cache-directories: rust/local-tts-bridge/target/llama-cmake-cache
          key: release-verify-llama-cmake-only-v1
      - if: steps.release.outputs.should_verify == 'true'
        run: npm ci
      - if: steps.release.outputs.should_verify == 'true'
        run: npm run lint
      - if: steps.release.outputs.should_verify == 'true'
        run: npx tsc --noEmit -p tsconfig.electron.json
      # Same split as ci.yml: the unit suite with its coverage gate first, then
      # the native-bridge integration test in its own vitest process so the
      # cargo build in its beforeAll cannot starve timing-sensitive Electron
      # tests.
      - if: steps.release.outputs.should_verify == 'true'
        run: npx vitest run --coverage --exclude "electron/rustLocalBridge.test.ts"
      - if: steps.release.outputs.should_verify == 'true'
        run: npx vitest run electron/rustLocalBridge.test.ts
      - if: steps.release.outputs.should_verify == 'true'
        run: npm run build:web

  publish:
    name: Publish source archive
    needs: verify
    if: needs.verify.outputs.publish_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Create release tag
        if: needs.verify.outputs.create_tag == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Open TTS $RELEASE_TAG"
          git push origin "$RELEASE_TAG"
      - name: Publish GitHub Release
        shell: bash
        run: |
          notes_file="docs/releases/$RELEASE_TAG.md"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false \
              --latest \
              --title "Open TTS $RELEASE_TAG" \
              --notes-file "$notes_file"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --latest \
              --title "Open TTS $RELEASE_TAG" \
              --notes-file "$notes_file"
          fi
