name: Verify release tags

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-24.04
    # test:js includes rustLocalBridge.test.ts, which cargo-builds the native
    # bridge on this Ubuntu runner; leave headroom for a cold compile.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Verify tag and package version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          package_version="$(node -p "require('./package.json').version")"
          if [[ "v$package_version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version." >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.electron.json
      - run: npm run test:js
      - run: npm run build:web
