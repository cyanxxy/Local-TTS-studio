name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Detect bridge changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      bridge: ${{ steps.filter.outputs.bridge }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # A pull_request run checks out GitHub's test merge commit, whose
          # first parent is the base branch tip, so HEAD^1..HEAD is the PR diff.
          fetch-depth: 2
          persist-credentials: false
      - name: Decide whether the Linux bridge test must run
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Pushes to main and manual runs always run the bridge test, as does
          # any checkout that is not a merge commit.
          if [[ "$EVENT_NAME" != "pull_request" ]] || ! git rev-parse --verify --quiet HEAD^2 >/dev/null; then
            echo "bridge=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only HEAD^1 HEAD)"
          printf '%s\n' "$changed"

          # Everything the bridge job builds, runs, or configures: the Rust
          # sources and toolchain, the cargo wrapper scripts, the test file and
          # the Vitest config, setup, and plugin it loads, the npm install
          # inputs, .gitattributes (it controls how rust/vendor is checked
          # out), and this workflow.
          bridge_paths='^(rust/|rust-toolchain\.toml$|scripts/[^/]*rust[^/]*$|electron/rustLocalBridge\.test\.ts$|vitest\.config\.ts$|src/test-setup\.ts$|vite\.kokoroAssets\.ts$|package\.json$|package-lock\.json$|\.npmrc$|\.nvmrc$|\.gitattributes$|\.github/workflows/ci\.yml$|\.github/actions/npm-install/)'
          if grep -qE "$bridge_paths" <<<"$changed"; then
            echo "bridge=true" >> "$GITHUB_OUTPUT"
          else
            echo "No bridge inputs changed; skipping the Linux bridge test."
            echo "bridge=false" >> "$GITHUB_OUTPUT"
          fi

  static:
    name: Lint, type-check, and build web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/npm-install
        with:
          node-version-file: .nvmrc
      - run: npm run lint
      # lint:rust is deliberately not run here: Clippy needs the full native
      # build, so rust-bridge.yml on macOS is this repo's native gate.
      - run: npx tsc --noEmit -p tsconfig.electron.json
      - run: npm run build:web

  # The jobs below share the account-wide limit of 20 concurrent jobs on the
  # GitHub Free plan with every other repository, so only the pinned-Node
  # tests, which gate the PR, are sharded.
  test:
    name: Test (Node pinned, shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with the `/3` in the name and the run step below.
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/npm-install
        with:
          node-version-file: .nvmrc
      # rustLocalBridge.test.ts compiles the native bridge in beforeAll and runs
      # in its own job below so the cargo build cannot starve timing-sensitive
      # Electron tests in this process. Each shard writes a blob report; the
      # `test-merge` job merges them, enforces the 100% coverage gate from
      # vitest.config.ts, and proves every test file ran.
      - run: >-
          npx vitest run
          --shard=${{ matrix.shard }}/3
          --exclude "electron/rustLocalBridge.test.ts"
          --reporter=default --reporter=blob
          --coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest/blob/
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

  test-merge:
    name: Merge test shards and enforce coverage
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/npm-install
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vitest-blob-*
          path: .vitest/blob
          merge-multiple: true
      - name: List the test files an unsharded run would collect
        run: npx vitest list --filesOnly --exclude "electron/rustLocalBridge.test.ts" --json="$RUNNER_TEMP/expected.json"
      # --coverage on the merge applies the thresholds in vitest.config.ts to
      # the combined coverage of every shard.
      - name: Merge shards and enforce the coverage gate
        run: |
          npx vitest run --merge-reports=.vitest/blob --coverage \
            --reporter=dot --reporter=json --outputFile.json="$RUNNER_TEMP/merged.json"
          node scripts/check-vitest-shards.mjs "$RUNNER_TEMP/expected.json" "$RUNNER_TEMP/merged.json"

  node-26:
    # The newest major that package.json `engines.node` admits; vitest.config.ts
    # carries a Node 26 specific workaround, so this job keeps it honest. Lint,
    # the Electron type check, and the coverage gate do not depend on the Node
    # version, so it repeats only the web build and an unsharded Vitest run.
    name: Test and build web (Node 26)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/npm-install
        with:
          node-version: "26"
      - run: npx vitest run --exclude "electron/rustLocalBridge.test.ts"
      - run: npm run build:web

  bridge-linux:
    name: Bridge integration test (Linux)
    needs: changes
    if: needs.changes.outputs.bridge == 'true'
    runs-on: ubuntu-24.04
    # The test cargo-builds the native bridge in beforeAll; leave headroom for
    # a cold compile of the llama.cpp dependency tree.
    timeout-minutes: 45
    env:
      # rustLocalBridge.test.ts honours CARGO_TARGET_DIR; point it inside the
      # workspace so the cache steps below can find the build.
      CARGO_TARGET_DIR: ${{ github.workspace }}/rust/local-tts-bridge/target
      # The test only needs a working binary. Skipping debug info shortens the
      # dev-profile compile and link; debug assertions stay on.
      CARGO_PROFILE_DEV_DEBUG: "0"
      # Incremental state only helps the workspace crates, which a fresh
      # checkout rebuilds anyway, and it would bloat the cached target dir.
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/npm-install
        with:
          node-version-file: .nvmrc
      - name: Install pinned Rust toolchain
        # No toolchain argument: rustup installs the active toolchain, so the
        # channel, profile, and components all come from rust-toolchain.toml.
        run: rustup toolchain install --no-self-update
      # The whole target dir and Cargo home, restored as one archive, instead of
      # Swatinem/rust-cache: rust-cache prunes target entries it does not
      # recognise, which split llama-cpp-sys's rlib from the CMake-built shared
      # libraries it links (see rust-bridge.yml). One archive restores them
      # together, and tar keeps the mtimes Cargo's build-script freshness checks
      # compare. Workspace crates still rebuild, since checkout gives their
      # sources new mtimes; only the dependency tree comes from the cache.
      - name: Restore Cargo build cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            rust/local-tts-bridge/target
          key: bridge-linux-cargo-v1-${{ hashFiles('rust-toolchain.toml', 'rust/Cargo.lock') }}
          # A newer lockfile still starts from the last dependency build, so
          # only the changed crates compile.
          restore-keys: bridge-linux-cargo-v1-
      - run: npm run test:rust:policy
      - run: npx vitest run electron/rustLocalBridge.test.ts
      # Only main saves, and only when the lockfile or toolchain changed, so
      # pull requests reuse main's build without adding caches of their own.
      - if: (github.ref == 'refs/heads/main' || github.head_ref == 'Agent/ci-parallel-shards-cache') && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            rust/local-tts-bridge/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  checks-complete:
    # Keep the branch-protection context stable as the underlying jobs expand.
    name: Lint, test, and build web
    needs: [changes, static, test, test-merge, node-26, bridge-linux]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI job to pass
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          TEST_RESULT: ${{ needs.test.result }}
          MERGE_RESULT: ${{ needs.test-merge.result }}
          NODE26_RESULT: ${{ needs.node-26.result }}
          BRIDGE_NEEDED: ${{ needs.changes.outputs.bridge }}
          BRIDGE_RESULT: ${{ needs.bridge-linux.result }}
        # The bridge job may be skipped only when the change detection itself
        # succeeded and found no bridge inputs; any other skip fails the check.
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          test "$STATIC_RESULT" = success
          test "$TEST_RESULT" = success
          test "$MERGE_RESULT" = success
          test "$NODE26_RESULT" = success
          if [[ "$BRIDGE_NEEDED" == "true" ]]; then
            test "$BRIDGE_RESULT" = success
          else
            test "$BRIDGE_RESULT" = skipped
          fi
